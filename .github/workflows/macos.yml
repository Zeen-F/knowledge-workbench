name: macOS checks and preview
on:
  push:
    branches: [main, "feat/**", "fix/**", "codex/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:mcp
      - run: npm run test:ui
        timeout-minutes: 3
      - run: npx playwright install chromium
      - run: npm run test:desktop-readiness
        timeout-minutes: 2
      - run: npm run test:inbox-controls
        timeout-minutes: 3
      - run: npm run test:panel
      - run: npm run test:materials-review
        timeout-minutes: 3
      - run: npm run test:shanlan
        timeout-minutes: 3
      - run: npm run test:reliability-ui
      - run: npm run desktop:dist:mac
      - name: Test packaged runtime
        timeout-minutes: 3
        shell: bash
        run: |
          if [[ "$(uname -m)" == arm64 ]]; then folder=mac-arm64; else folder=mac; fi
          installed="$RUNNER_TEMP/知识工作台 installed/Knowledge Workbench.app"
          mkdir -p "$(dirname "$installed")"
          ditto "release/$folder/Knowledge Workbench.app" "$installed"
          KWB_TEST_EXE="$installed/Contents/MacOS/Knowledge Workbench" npm run test:ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-preview
          path: |
            release/*.dmg
            release/*.zip
            output/playwright/
            output/reliability/
            output/materials-review/
          retention-days: 14
