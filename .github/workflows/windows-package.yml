name: Windows preview package
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm.cmd ci
      - run: npm.cmd run check
      - run: npm.cmd run test:mcp
      - run: npm.cmd run desktop:dist
      - name: Test packaged app
        shell: pwsh
        run: |
          $env:KWB_TEST_EXE = (Resolve-Path 'release/win-unpacked/Knowledge Workbench.exe').Path
          npm.cmd run test:ui
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-preview
          path: |
            release/*.exe
            release/*.blockmap
          retention-days: 14
