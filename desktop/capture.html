<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src data:"
    />
    <title>框选截图</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        cursor: crosshair;
        font:
          14px "Segoe UI",
          "Microsoft YaHei",
          sans-serif;
      }
      #screen {
        position: absolute;
        width: 100%;
        height: 100%;
        inset: 0;
        pointer-events: none;
      }
      #shade {
        position: absolute;
        inset: 0;
        background: #0006;
        pointer-events: none;
      }
      #selection {
        position: absolute;
        display: none;
        border: 2px solid #69e7bd;
        box-shadow: 0 0 0 99999px #0006;
        pointer-events: none;
      }
      #hint {
        position: absolute;
        top: 22px;
        left: 50%;
        transform: translateX(-50%);
        background: #162f2deb;
        color: white;
        padding: 12px 20px;
        border-radius: 8px;
        pointer-events: none;
      }
      #size {
        position: absolute;
        background: #162f2deb;
        color: white;
        white-space: nowrap;
        padding: 4px 8px;
        bottom: -30px;
        left: 0;
      }
    </style>
  </head>
  <body>
    <img id="screen" alt="当前显示器" />
    <div id="shade"></div>
    <div id="selection"><span id="size"></span></div>
    <div id="hint">拖动框选 · 松开保存到收集箱 · Esc 取消</div>
    <script src="capture.js"></script>
  </body>
</html>
